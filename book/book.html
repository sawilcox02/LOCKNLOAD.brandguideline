.rows{display:grid;grid-template-columns:2.609375in 1fr;column-gap:.1875in;row-gap:11pt;align-content:start}

.rule b{color:var(--shadow)}
.dark .rule{color:var(--w70)}.dark .rule b{color:#fff}

.chip.f{background:var(--shadow);color:#fff;border-color:var(--shadow)}
.tbl{width:100%;border-collapse:collapse;font-size:9pt;line-height:12pt}
.tbl td,.tbl th{text-align:left;padding:4.5pt 6pt 4.5pt 0;border-top:.5pt solid var(--line);vertical-align:top}
.tbl th{font-family:"address-sans-pro","Txt";font-weight:600;font-size:6pt;letter-spacing:.12em;text-transform:uppercase;color:var(--m70)}
.lines{display:grid;gap:0}
.lines i{display:block;height:18pt;border-bottom:.5pt solid var(--line)}
.flow{column-count:3;column-gap:.1875in;column-fill:auto;font-size:9pt;line-height:13.5pt}
.flow h4{font-family:"bc-barell-extended-black","Disp";font-stretch:125%;font-weight:900;font-size:8pt;letter-spacing:.04em;text-transform:uppercase;margin:6pt 0 3pt;break-after:avoid}
.flow h4:first-child{margin-top:0}
.flow p{margin-bottom:6pt}
.flow .q{break-inside:avoid;margin-bottom:8pt}
.flow .q .qh{display:flex;gap:5pt;font-weight:600}
.flow .q .qn{font-family:"bc-barell-extended-black","Disp";font-stretch:125%;font-weight:900;font-size:7pt;color:var(--pulse);padding-top:1.5pt}
.flow .q .help{font-size:8pt;line-height:11pt;color:var(--m70);margin:2pt 0 2pt}
.flow .q .lines i{height:15pt}
.flow .gh{break-after:avoid;margin:0 0 6pt}
.flow .gh .d{font-size:10pt}
/* guides overlay */
.guides{position:absolute;left:0;top:0;width:12.25in;height:7in;pointer-events:none;z-index:50}
/* sheet chrome */
.slug{position:absolute;left:2.5in;right:2.5in;font-family:"address-sans-pro","Txt";font-size:7pt;color:#444;display:flex;justify-content:space-between;gap:20pt}
.slug b{color:#000}
.crop{position:absolute;left:0;top:0;width:17in;height:11in;pointer-events:none}
/* spec sheets */
.spec{padding:.6in .7in;width:17in;height:11in;position:relative}
.spec h1{font-family:"bc-barell-extended-black","Disp";font-stretch:125%;font-weight:900;text-transform:uppercase;font-size:30pt;line-height:.95;margin-bottom:6pt}
.spec h2{font-family:"bc-barell-extended-black","Disp";font-stretch:125%;font-weight:900;text-transform:uppercase;font-size:11pt;margin:14pt 0 6pt}
.spec p,.spec li{font-size:10pt;line-height:14pt}
.spec .cols{display:grid;gap:.4in}
.spec .tbl{font-size:9pt;line-height:12.5pt}
.spec .tbl th{font-size:7pt}
.spec ul{padding-left:14pt}
.legend span{display:inline-flex;align-items:center;gap:6pt;margin-right:16pt;font-size:9pt}
.legend i{display:inline-block;width:22pt;height:0;border-top:1.5pt solid}
.tag{position:absolute;font-family:"address-sans-pro","Txt";font-weight:600;font-size:7pt;letter-spacing:.06em;text-transform:uppercase;color:#d0006f}
.mini{position:absolute;transform-origin:0 0}
.mini .bp{left:0!important;top:0!important}

add(pg({code:'01.4',chap:c1,label:'Tone visual',html:`<div class="abs" style="${box(1,8,1,1)}"><div class="k">01.4</div><div class="d h2">This, not that</div></div>`+PAIRS.map((p,i)=>`<div class="abs" style="${box((i%3)*4+1,(i%3)*4+4,2+Math.floor(i/3)*2+ (i>2?1:0),3+Math.floor(i/3)*2+(i>2?1:0),'border-top:1.5pt solid var(--shadow);padding-top:8pt')}"><div class="d" style="font-size:17pt">${p[0]}</div><p style="font-size:10pt;margin-top:5pt" class="mut">without <s style="text-decoration-color:${C.pulse};text-decoration-thickness:1.5pt">${p[1]}</s></p></div>`).join('')}),
 copyPage('01.4',c1,'Tone &amp; Manner',R('Tone &amp; Manner','<p class="lead">LOCKNLOAD communicates with enthusiasm and familiarity, encouraging players to challenge themselves, support their teammates, and enjoy the experience.</p><p>Its language is direct, engaging, and action-oriented. Messaging celebrates both individual achievement and collective success. The tone is competitive without aggression, expressive without unnecessary complexity, and encouraging without sounding overly sentimental.</p>')));
add(pg({dark:true,code:'01.4',chap:c1,label:'Messaging visual',html:`<div class="abs d" style="${box(1,12,2,5,'display:flex;align-items:center;font-size:96pt')}">Lock&nbsp;<span style="color:${C.pulse}">N.</span></div>`}),
 copyPage('01.4',c1,'Messaging',R('Messaging','<p class="lead">LOCKNLOAD encourages players to come together, find their playstyle, and embrace the excitement of shared experiences.</p><p>The phrase “LOCK N” or “LOCKNLOAD” itself serves as a recognizable call to action, encouraging players to focus, participate, and come together through play. It reinforces preparation, participation, and shared excitement.</p>')));

const misSvg=([t,d,g,w,e,rb])=>{let inner;if(rb)inner=P(ASSETS.wordL,w,'transform="translate(0 -40)"')+P(ASSETS.wordR,w,'transform="translate(-200 60)"')+P([ASSETS.emblemInLogo[0]],e,'transform="translate(-30 -30)"')+P([ASSETS.emblemInLogo[1]],e,'transform="translate(40 30)"');else if(w==='none')inner=`<g ${g}>${[...ASSETS.wordL,...ASSETS.wordR,...ASSETS.emblemInLogo].map(x=>`<path d="${x}"/>`).join('')}</g>`;else inner=`<g ${g}>${P(ASSETS.wordL,w)+P(ASSETS.wordR,w)+P(ASSETS.emblemInLogo,e)}</g>`;
 return `<div style="position:relative;border:.5pt solid var(--line);height:${gh(1,2)-.32}in;display:flex;align-items:center;justify-content:center"><svg viewBox="-40 -60 1423 298" style="width:80%">${inner}</svg><svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"><line x1="0" y1="0" x2="100" y2="100" stroke="${C.shadow}" stroke-opacity=".6" stroke-width="1" vector-effect="non-scaling-stroke"/></svg></div><div class="lab" style="margin-top:5pt">${t}</div>`};
add(pg({code:'02.1',chap:c2,label:'Logo misuse visual',html:MIS.map((m,i)=>`<div class="abs" style="${box((i%3)*4+1,(i%3)*4+4,1+Math.floor(i/3)*3,2+Math.floor(i/3)*3)}">${misSvg(m)}</div>`).join('')}),
 copyPage('02.1',c2,'Logo Misuse',R('Never',`<table class="tbl">${MIS.map(m=>`<tr><td style="width:1in"><b>${m[0]}</b></td><td>${m[1]}</td></tr>`).join('')}</table>`)+R('If it won’t fit','<p>If an application cannot hold the logo without compromising it, request an alternative arrangement or approved variation. Do not distort approved assets to fit a format.</p>')));

 copyPage('02.2',c2,'The Emblem',R('Construction','<p class="lead">Two mirrored L forms create an N in negative space, tying the name directly to the form.</p><p>The mirrored elements also read as two blasters, side by side, signalling connection, teamwork and shared play.</p>')+R('Meaning','<p>Its interlocking geometry reflects modularity and adaptability while the balanced angular structure conveys stability and perseverance. Together, the mark becomes a concise symbol of individual expression, collective strength, and limitless play.</p>'),

 copyPage('02.3',c2,'Faction Emblems',R('System','<p>The faction emblems adapt the original brand mark to represent three distinct playstyles. Each variation incorporates elements inspired by its respective blaster configuration, reinforcing individuality and customization within a unified modular system.</p>')+R('Mapping',`<table class="tbl"><tr><th>Faction</th><th>Color</th><th>Detail</th></tr>${FAC.map(f=>`<tr><td><b>${f[1]}</b></td><td>${f[2]} ${f[3]}</td><td>${f[5]}</td></tr>`).join('')}</table>`),

  ${[['Pulse Violet','#9C26F0','156 38 240','Primary identifier. Creative energy and self-expression.'],['Shadow Alloy','#211F2D','33 31 45','Primary. Grounded, modular, industrial foundation.'],['Frost Signal','#EEF1F9','238 241 249','Primary. Clarity and accessibility. In print, used only where the palette itself is shown.'],['Ignition Orange','#FF7514','255 117 20','Secondary. Momentum and friendly competition. Focus faction.'],['Surge Green','#91E829','145 232 41','Secondary. Tactical energy and motion. Breach faction.']].map(r=>`<tr><td><span style="display:inline-block;width:7pt;height:7pt;background:${r[1]};outline:.5pt solid var(--line);margin-right:5pt"></span><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</table></div>`+R('Rules','<p>Use the five colors exclusively, at their exact values. Lead with Pulse, support with Shadow, and apply Ignition and Surge with purpose, especially for faction work. No added brand colors and no approximate shades.</p>')));
const keys=[['pulse','Pulse'],['shadow','Shadow'],['frost','Frost'],['ign','Ignition'],['surge','Surge']];
const hexRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const lum=h=>{const [r,g,b]=hexRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
const ratio=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const cell=.62;
const mx=`<table style="border-collapse:separate;border-spacing:3pt;font-variant-numeric:tabular-nums"><tr><th></th>${keys.map(k=>`<th class="lab" style="font-size:5.5pt;text-align:left">${k[1]}</th>`).join('')}</tr>${keys.map(f=>`<tr><th class="lab" style="font-size:5.5pt;text-align:left;padding-right:4pt">${f[1]}</th>${keys.map(b=>{if(f[0]===b[0])return `<td></td>`;const r=ratio(C[f[0]],C[b[0]]);return `<td style="width:${cell}in;height:${cell*.68}in;background:${C[b[0]]};color:${C[f[0]]};${b[0]==='frost'?'outline:.5pt solid var(--line);':''}text-align:center;font-family:bc-barell-extended-black,Disp;font-stretch:125%;font-weight:900;font-size:${r>=3?10:7}pt;opacity:${r>=3?1:.55}">${r.toFixed(1)}</td>`}).join('')}</tr>`).join('')}</table>`;
const pass=[],large=[],avoid=[];keys.forEach(f=>keys.forEach(b=>{if(f[0]===b[0])return;const r=ratio(C[f[0]],C[b[0]]);const s=`${f[1]} on ${b[1]} (${r.toFixed(1)})`;(r>=4.5?pass:r>=3?large:avoid).push(s)}));
add(pg({code:'02.4',chap:c2,label:'Contrast matrix visual',html:`<div class="abs" style="${box(1,5,1,1)}"><div class="k">02.4</div><div class="d h2">Contrast</div></div><div class="abs" style="${box(5,12,1,6,'display:flex;align-items:center;justify-content:flex-start')}">${mx}</div><p class="abs cap" style="${box(1,4,4,6,'display:flex;align-items:flex-end')}">Rows: text color. Columns: background. Values are WCAG contrast ratios.</p>`}),
 copyPage('02.4',c2,'Contrast Pairings',R('Body copy',`<p><b>4.5:1 and up.</b> ${pass.join(', ')}.</p>`)+R('Headlines only',`<p><b>3:1 to 4.5:1.</b> ${large.join(', ')}.</p>`)+R('Avoid for text',`<p class="mut">${avoid.join(', ')}.</p>`)));
add(pg({dark:true,code:'02.5',chap:c2,label:'BC Barell specimen',html:`<div class="abs" style="${box(1,8,1,1)}"><div class="k">Primary · Display</div></div><div class="abs d" style="${box(1,12,1,4,'display:flex;align-items:flex-end;font-size:84pt;line-height:.9')}">BC Barell</div><div class="abs d" style="${box(1,9,5,6,'font-size:15pt;line-height:1.25')}">ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>0123456789 &amp;!?.,</div>`}),
 copyPage('02.5',c2,'Typography',R('BC Barell','<p><b>Extended Black.</b> Primary display typeface for headlines, prominent messaging, and branded statements. Confident, bold, energetic.</p>')+R('Address Sans Pro','<p style="font-size:15pt;line-height:18pt;margin-bottom:5pt">Aa Bb Cc Dd Ee Ff Gg 0123456789</p><p>Secondary typeface for body copy, supporting information, descriptions, and functional communication. Clear, accessible, readable.</p>')+R('Rules','<p>Hierarchy comes from size, weight, spacing, and placement, never from additional typefaces. Do not stretch, distort, outline, or substitute the approved typefaces.</p>')));
add(pg({dark:true,code:'02.5',chap:c2,label:'Hierarchy sample',html:`<div class="abs" style="${box(1,10,1,6,'display:flex;flex-direction:column;justify-content:flex-end;gap:9pt')}"><div class="d" style="font-size:58pt">Arena<br>Open Play</div><div class="d" style="font-size:22pt;color:${C.pulse}">Play together</div><p style="font-size:11pt;line-height:15pt;max-width:4.5in" class="mut">Drop in. Gear up. Rental kits and timed sessions welcome newcomers.</p></div>`}),
 copyPage('02.5',c2,'Type Hierarchy',R('Composition','<p>Default to left-aligned typography on a consistent grid. For promotional compositions, use at most <b>two BC Barell sizes</b> and <b>one Address Sans Pro size</b>. Keep natural kerning and leading; no outlines, glow, or extra effects.</p>')+R('Book scale',`<table class="tbl"><tr><th>Style</th><th>Face</th><th>Size / leading</th></tr><tr><td>Display 1</td><td>BC Barell</td><td>54–58 pt / 0.92</td></tr><tr><td>Display 2</td><td>BC Barell</td><td>24 pt / 0.92</td></tr><tr><td>Label</td><td>BC Barell</td><td>7 pt caps, +50</td></tr><tr><td>Lead</td><td>Address Sans Pro</td><td>12.5 / 16.875 pt</td></tr><tr><td>Body</td><td>Address Sans Pro</td><td>9 / 13.5 pt</td></tr><tr><td>Caption</td><td>Address Sans Pro</td><td>6.5 / 9 pt</td></tr></table>`)));

 const rowsTbl=(arr)=>`<table class="tbl">${arr.map(r=>`<tr><td style="width:2.1in"><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')}</table>`;
